name: atlas-cmms
services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas_db
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready ships with the image. Without this the api can start before postgres
      # accepts connections, and Spring wraps the resulting lookup failure in an
      # AuthenticationException — the login form then claims the password is wrong.
      # No variables on purpose. `$${VAR}` relies on Coolify passing the escape through
      # untouched, and the api now waits for this check — a mangled probe would keep the
      # stack down. Argument-less pg_isready answers the only question that matters here,
      # "is the server accepting connections", and needs no credentials to do it.
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    # Set IMAGE_TAG to sha-<commit> in Coolify to pin or roll back a release.
    image: ghcr.io/sayou2000/cmms4fm-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: atlas-cmms-backend
    depends_on:
      postgres:
        condition: service_healthy
      # Deliberately not service_healthy: the api boots fine without object storage, only
      # uploads fail, so gating startup on minio would trade a working login for a
      # dependency that does not block it.
      minio:
        condition: service_started
    volumes:
      - ./logo:/app/static/images
      - ./config:/app/static/config
    environment:
      DB_URL: postgres/atlas
      DB_USER: ${POSTGRES_USER}
      DB_PWD: ${POSTGRES_PWD}
      PUBLIC_API_URL: ${PUBLIC_SERVER_URL}/api
      PUBLIC_FRONT_URL: ${PUBLIC_SERVER_URL}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      GCP_JSON: ${GCP_JSON}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      MAIL_RECIPIENTS: ${MAIL_RECIPIENTS}
      SMTP_PWD: ${SMTP_PWD}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: atlas-bucket
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE:-minio} #gpc|minio
      PUBLIC_MINIO_ENDPOINT: ${PUBLIC_SERVER_URL}/storage
      INVITATION_VIA_EMAIL: ${INVITATION_VIA_EMAIL:-false}
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-false}
      ENABLE_SSO: ${ENABLE_SSO:-false}
      OAUTH2_PROVIDER: ${OAUTH2_PROVIDER}
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_FINGERPRINT_REQUIRED: ${LICENSE_FINGERPRINT_REQUIRED:-false}
      LICENSE_FILE_PATH: ${LICENSE_FILE_PATH:-}
      ALLOWED_ORGANIZATION_ADMINS: ${ALLOWED_ORGANIZATION_ADMINS:-}
      LOGO_PATHS: ${LOGO_PATHS}
      CUSTOM_COLORS: ${CUSTOM_COLORS}
      BRAND_CONFIG: ${BRAND_CONFIG}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET_KEY: ${PADDLE_WEBHOOK_SECRET_KEY:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      ENABLE_CORS: ${ENABLE_CORS:-false}
      KEYGEN_PRODUCT_TOKEN: ${KEYGEN_PRODUCT_TOKEN:-}
      MAIL_TYPE: ${MAIL_TYPE:-smtp}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_CONTACT_LIST_ID: ${SENDGRID_CONTACT_LIST_ID:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}

      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_ORG_ADMIN: ${LDAP_ORG_ADMIN:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_MANAGER_DN: ${LDAP_MANAGER_DN:-}
      LDAP_MANAGER_PASSWORD: ${LDAP_MANAGER_PASSWORD:-}
      LDAP_USER_SEARCH_BASES: ${LDAP_USER_SEARCH_BASES:-}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-}
      LDAP_ATTR_EMAIL: ${LDAP_ATTR_EMAIL}
      LDAP_ATTR_FIRSTNAME: ${LDAP_ATTR_FIRSTNAME}
      LDAP_ATTR_LASTNAME: ${LDAP_ATTR_LASTNAME}
      LDAP_ATTR_USERNAME: ${LDAP_ATTR_USERNAME}
      LDAP_OBJECT_CLASS: ${LDAP_OBJECT_CLASS:-}
      LDAP_OU_ROLE_MAPPINGS: ${LDAP_OU_ROLE_MAPPINGS:-}
      LDAP_SYNC_ENABLED: ${LDAP_SYNC_ENABLED:-false}
      LDAP_SYNC_CREATE: ${LDAP_SYNC_CREATE:-false}
      LDAP_SYNC_UPDATE: ${LDAP_SYNC_UPDATE:-false}
      LDAP_SYNC_DISABLE: ${LDAP_SYNC_DISABLE:-false}
      LDAP_SYNC_CRON: ${LDAP_SYNC_CRON}
    expose:
      - "8080"
    healthcheck:
      # The readiness group is configured in application.yml to readinessState + db, so this
      # goes green only once Liquibase, Hibernate and Quartz are done and the datasource
      # answers. Not the plain /actuator/health: that includes the mail indicator, which is
      # on by default (ENABLE_MAIL_HEALTH_CHECK) and reports DOWN when mail is unconfigured.
      # wget comes from busybox in the alpine base image.
      # Nothing depends on this being healthy — it is a signal for Coolify and docker ps,
      # so a wrong probe cannot keep the stack from starting.
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 150s

  frontend:
    image: ghcr.io/sayou2000/cmms4fm-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: atlas-cmms-frontend
    environment:
      API_URL: /api
      GOOGLE_KEY: ${GOOGLE_KEY:- }
      GOOGLE_TRACKING_ID: ${GOOGLE_TRACKING_ID:- }
      INVITATION_VIA_EMAIL: ${INVITATION_VIA_EMAIL:-false}
      CLOUD_VERSION: ${CLOUD_VERSION:-false}
      NODE_ENV: production
      ENABLE_SSO: ${ENABLE_SSO:-false}
      OAUTH2_PROVIDER: ${OAUTH2_PROVIDER:- }
      LOGO_PATHS: ${LOGO_PATHS:- }
      CUSTOM_COLORS: ${CUSTOM_COLORS:- }
      BRAND_CONFIG: ${BRAND_CONFIG:- }
      DEMO_LINK: ${DEMO_LINK:- }
      HOME_URL: ${HOME_URL:-https://www.cmms.corefm.de}
      PADDLE_SECRET_TOKEN: ${PADDLE_SECRET_TOKEN:- }
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:- }
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
    expose:
      - "3000"
    depends_on:
      - api

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: atlas_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    command: server --address ":9000" --console-address ":9001" /data

  nginx:
    # Config is baked in (see docker/nginx/Dockerfile) — no bind mount.
    image: ghcr.io/sayou2000/cmms4fm-nginx:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: atlas_nginx
    depends_on:
      - frontend
      - api
      - minio
    environment:
      # Coolify magic variable: binds its reverse proxy (TLS, certificates) to
      # port 80 of this service and fills in the domain. Set the domain in the
      # Coolify UI — PUBLIC_SERVER_URL must be set to the same value.
      - SERVICE_FQDN_NGINX_80
    # No host port binding: Coolify's proxy routes to this container directly.
    # Publishing 3000:80 would bypass TLS and collide with other stacks.
    expose:
      - "80"

volumes:
  postgres_data:
  minio_data:
