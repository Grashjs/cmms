name: API Tests

# Deliberately separate from deploy.yml: tests run alongside the image build
# rather than gating it, so a deploy is never held up by a 20-minute test run.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test -DargLine="--add-opens java.base/java.lang=ALL-UNNAMED"
        working-directory: ./api
