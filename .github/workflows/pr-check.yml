name: PR Check (build & tests, no deploy)

# Verificación previa a fusionar. NO despliega, NO publica imágenes y NO usa secretos.
# El despliegue sigue siendo exclusivo de main-ci.yml (push a main / tags v*).
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compile + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Compile main and test sources
        run: mvn -B test-compile
        working-directory: ./api

      - name: Run tests
        run: mvn -B test -DargLine="--add-opens java.base/java.lang=ALL-UNNAMED"
        working-directory: ./api

  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./frontend

      - name: Build project
        run: npm run build
        working-directory: ./frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
