name: Build and Deploy to GHCR

on:
  push:
    branches:
      - main
    # No image content comes from prose, so a documentation commit has nothing to deploy.
    # This only started to matter once the Coolify trigger worked: before that a push
    # merely built images, now it restarts the running containers.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'dev-docs/**'
  workflow_dispatch:

# A second push while a build is running cancels the first one — Coolify must
# never be triggered by a build that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: ./api
            image: cmms4fm-api
          - name: frontend
            context: ./frontend
            image: cmms4fm-frontend
          - name: nginx
            context: ./docker/nginx
            image: cmms4fm-nginx
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR only accepts lowercase paths; the owner slug may not be.
      - name: Resolve image name
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # `latest` is what docker-compose resolves by default; the sha tag is
          # what makes a rollback possible (set IMAGE_TAG in Coolify).
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Trigger Coolify
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # The `secrets` context is not available in step-level `if:`, so the
      # emptiness check has to happen inside the shell.
      - name: Trigger Coolify Webhook
        env:
          HOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::COOLIFY_WEBHOOK_URL not set — skipping deploy trigger."
            exit 0
          fi
          # Coolify exposes two triggers and they disagree about the method: the deploy API
          # (/api/v1/deploy?uuid=…) answers GET, the resource webhook (/webhooks/…) answers
          # POST and returns 405 for anything else. Which one a given installation hands out
          # is not visible from here, and the secret cannot be read back — so try both rather
          # than encode a guess. Every run from 2026-08-26 to 2026-09-04 failed on a bare GET
          # with exactly that 405, built three images, and told Coolify nothing.
          # An array, not string interpolation: an unquoted ${AUTH:+-H "$AUTH"} word-splits on
          # the spaces inside the header and curl receives four arguments instead of two.
          ARGS=(-fsS)
          if [ -n "$TOKEN" ]; then ARGS+=(-H "Authorization: Bearer $TOKEN"); fi
          for method in GET POST; do
            if curl "${ARGS[@]}" -X "$method" "$HOOK" >/dev/null; then
              echo "Coolify deploy triggered for sha-${GITHUB_SHA} ($method)"
              exit 0
            fi
            echo "::notice::Coolify rejected $method; trying the other method."
          done
          echo "::error::Coolify refused both GET and POST. Check that COOLIFY_WEBHOOK_URL points at an existing resource and that COOLIFY_API_TOKEN may deploy it."
          exit 1
