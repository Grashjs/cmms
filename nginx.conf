# Atlas CMMS — single-domain reverse proxy
#
# Routes everything through one public host:
#   /         -> frontend (React)
#   /api/     -> backend  (Spring Boot)
#   /storage/ -> minio    (object storage / attachments)
#
# The browser only ever talks to this nginx container, so CORS,
# separate DNS records, and separate certificates are unnecessary.

upstream atlas_frontend {
    server frontend:3000;
}

upstream atlas_backend {
    server api:8080;
}

upstream atlas_minio {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    # ---- Frontend (React app) ----
    location / {
        # CSP only for HTML frontend — irrelevant for API/MinIO JSON responses
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' google.com https://*.paddle.com https://*.googletagmanager.com https://*.clarity.ms https://*.intercomcdn.com https://*.intercom.io https://*.google.com https://*.googleapis.com https://*.googleadservices.com https://*.doubleclick.net https://public.profitwell.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.paddle.com; img-src 'self' data: blob: google.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.doubleclick.net https://*.googleadservices.com https://*.intercomcdn.com https://static.intercomassets.com https://storage.googleapis.com https://*.clarity.ms https://*.bing.com; font-src 'self' data: https://*.gstatic.com https://*.intercomcdn.com; connect-src 'self' wss: ws: https://api.atlas-cmms.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.intercom.io https://*.clarity.ms https://*.google.com google.com https://*.google-analytics.com https://*.doubleclick.net https://*.paddle.com https://*.googleapis.com https://*.profitwell.com; media-src 'self' https://*.intercomcdn.com; frame-src 'self' https://*.intercomcdn.com https://*.google.com https://*.intercom.io https://*.paddle.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # Re-declare because nginx drops parent add_header when child has any
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://atlas_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Signed attachment capabilities must not enter access logs.
    location /api/files/content/ {
        access_log off;
        proxy_pass http://atlas_backend/files/content/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        add_header Content-Security-Policy "sandbox; default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ---- Backend API ----
    location /api/ {
        proxy_pass http://atlas_backend/;
        # Critical for WebSockets and streaming protocols
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix for streaming/long-polling fallbacks (prevents Nginx from buffering chunks)
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

    }

    # ---- MinIO object storage ----
    location /storage/ {
        access_log off;
        proxy_pass http://atlas_minio/;

        # Legacy URLs: no MIME-based exceptions, including PDF. New images use /api/files/content/.
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        add_header Content-Type "application/octet-stream" always;
        add_header Content-Disposition 'attachment; filename="attachment"' always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MinIO needs large, unbuffered uploads
        proxy_buffering off;
        client_max_body_size 500M;

    }
}

# ---------------------------------------------------------------------------
# HTTPS (recommended for production)
# ---------------------------------------------------------------------------
# Easiest path for self-hosters: keep the block above on plain HTTP and put
# this container behind Caddy, Traefik, Cloudflare Tunnel, or NGINX Proxy
# Manager for TLS termination — that's what most users already run.
#
# If you'd rather terminate TLS in this container directly with certbot,
# uncomment and adapt:
#
# server {
#     listen 443 ssl;
#     server_name cmms.example.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#
#     client_max_body_size 200M;
#     location /         { proxy_pass http://atlas_frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
#     location /api/     { proxy_pass http://atlas_backend/;  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
#     # Copy the complete /api/files/content/ and /storage/ locations above,
#     # including ALL response headers. Do not add a raw storage proxy here.
# }
