# Atlas CMMS — single-domain reverse proxy
#
# Routes everything through one public host:
#   /         -> frontend (React)
#   /api/     -> backend  (Spring Boot)
#   /storage/ -> minio    (object storage / attachments)
#
# The browser only ever talks to this nginx container, so CORS,
# separate DNS records, and separate certificates are unnecessary.

upstream atlas_frontend {
    server frontend:3000;
}

upstream atlas_backend {
    server api:8080;
}

upstream atlas_minio {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    # ---- Container health ----
    # Answered by nginx itself, no upstream involved. This is the container Traefik routes
    # to, so its health has to mean "the proxy can serve", not "the api finished booting" —
    # tying it to the backend would black out the whole domain, login form included, for the
    # minute the api needs to start.
    # `return` with a body already sets Content-Type: text/plain — an add_header for it would
    # emit the header twice. Nothing else in here, because this config cannot be validated
    # before it ships: `nginx -t` in the image build would resolve the upstream hostnames
    # above and fail, so a syntax error would only surface as a crash-looping proxy.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---- Frontend (React app) ----
    location / {
        proxy_pass http://atlas_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Public account creation: closed ----
    #
    # Both endpoints are permitAll in WebSecurityConfig and create *enabled*
    # accounts with a valid JWT, no credentials required:
    #
    #   /auth/signup           With INVITATION_VIA_EMAIL=false the invitation
    #                          check in UserService.signup is skipped entirely,
    #                          so a request carrying {"role":{"id":N}} joins the
    #                          organization that owns role N — with that role.
    #                          Role ids are sequential, so an administrator role
    #                          is trivially guessable.
    #   /demo/generate-account Creates an enabled demo account, rate limited per
    #                          IP only.
    #
    # Exact-match locations take precedence over the /api/ prefix below.
    # To onboard a colleague, comment the signup line out for the duration of
    # the invitation, or remove both once the backend enforces invitations.
    location = /api/auth/signup           { return 403; }
    location = /api/demo/generate-account { return 403; }

    # ---- Backend API ----
    location /api/ {
        proxy_pass http://atlas_backend/;
        # Critical for WebSockets and streaming protocols
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix for streaming/long-polling fallbacks (prevents Nginx from buffering chunks)
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

    }

    # ---- MinIO object storage ----
    location /storage/ {
        proxy_pass http://atlas_minio/;

        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MinIO needs large, unbuffered uploads
        proxy_buffering off;
        client_max_body_size 500M;

    }
}

# ---------------------------------------------------------------------------
# HTTPS (recommended for production)
# ---------------------------------------------------------------------------
# Easiest path for self-hosters: keep the block above on plain HTTP and put
# this container behind Caddy, Traefik, Cloudflare Tunnel, or NGINX Proxy
# Manager for TLS termination — that's what most users already run.
#
# If you'd rather terminate TLS in this container directly with certbot,
# uncomment and adapt:
#
# server {
#     listen 443 ssl;
#     server_name cmms.example.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#
#     client_max_body_size 200M;
#     location /         { proxy_pass http://atlas_frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
#     location /api/     { proxy_pass http://atlas_backend/;  proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
#     location /storage/ { proxy_pass http://atlas_minio/;    proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_buffering off; client_max_body_size 500M; }
# }
